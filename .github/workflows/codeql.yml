# CodeQL — static security analysis
#
# Runs on every push and PR to main, and once a day on a schedule so that newly published
# vulnerability patterns are caught against unchanged code. A daily run matters because
# CodeQL's query packs are updated continuously: code that was clean last week can be
# flagged this week without a single line changing.
#
# This repo is private, and uploading results to the Security → Code scanning tab
# requires GitHub Advanced Security, which isn't enabled here (that upload step fails
# with "Code scanning is not enabled for this repository"). So this workflow analyzes
# but never uploads: results are written to SARIF and published as a workflow artifact
# instead, downloadable from the run's summary page for ~30 days.
#
# If GHAS is ever enabled (or the repo goes public), delete the `upload: false` /
# `output` lines below and add back `security-events: write` to get the Security-tab
# integration this Action supports out of the box.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 07:17 UTC daily. Deliberately off the hour — scheduled jobs queued exactly on the
    # hour compete with the rest of GitHub and get delayed.
    - cron: '17 7 * * *'
  workflow_dispatch: # lets you trigger a scan by hand from the Actions tab

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false # one language failing must not hide the other's results
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      # checkout v4 runs on Node 20, which GitHub now forces onto Node 24 with a
      # deprecation warning. v5 targets Node 24 natively.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # `languages`, plural. The singular form is not a valid input: the action
          # ignores it and falls back to auto-detection, so the matrix value never
          # reaches CodeQL. It fails as a warning rather than an error, which is easy
          # to miss in a run that is already red for another reason.
          languages: ${{ matrix.language }}
          # security-extended adds lower-severity and precision queries beyond the
          # default set. Worth it here: this is coursework, not a high-traffic service,
          # so a slower scan with more findings is the better trade.
          queries: security-extended

      # No build step: this project is interpreted TypeScript (Vite/tsx) and Python,
      # so CodeQL can analyse the sources directly.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          output: sarif-results
          upload: false

      - name: Upload SARIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
          retention-days: 30
